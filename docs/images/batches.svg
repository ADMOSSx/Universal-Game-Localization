<text x="48" y="76" font-size="14" fill="#94a3b8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">same 100 entries and same translation length; before = full entries, indented JSON</text>
<text x="48" y="122" font-size="17" fill="#e2e8f0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600">Sent to the AI: before</text><rect x="260" y="96" width="640" height="38" rx="10" fill="#1e293b"/><rect x="260" y="96" width="581" height="38" rx="10" fill="#ef4444"/><text x="827" y="122" text-anchor="end" font-size="17" font-weight="700" fill="#ffffff" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">50.4 KB</text><text x="48" y="180" font-size="17" fill="#e2e8f0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600">Sent to the AI: now</text><rect x="260" y="154" width="640" height="38" rx="10" fill="#1e293b"/><rect x="260" y="154" width="177" height="38" rx="10" fill="#22c55e"/><text x="449" y="180" font-size="17" font-weight="700" fill="#f1f5f9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">15.4 KB</text><text x="48" y="238" font-size="17" fill="#e2e8f0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600">AI writes back: before</text><rect x="260" y="212" width="640" height="38" rx="10" fill="#1e293b"/><rect x="260" y="212" width="640" height="38" rx="10" fill="#ef4444"/><text x="886" y="238" text-anchor="end" font-size="17" font-weight="700" fill="#ffffff" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">55.5 KB</text><text x="48" y="296" font-size="17" fill="#e2e8f0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600">AI writes back: now</text><rect x="260" y="270" width="640" height="38" rx="10" fill="#1e293b"/><rect x="260" y="270" width="116" height="38" rx="10" fill="#22c55e"/><text x="388" y="296" font-size="17" font-weight="700" fill="#f1f5f9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">10.1 KB</text>
<text x="48" y="394" font-size="14" fill="#94a3b8" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">Sent 69% smaller, written back 82% smaller. Merge restores every field by ID.</text>
